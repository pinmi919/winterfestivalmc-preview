name: Deploy MCWF V2 Preview

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout V2 source
        uses: actions/checkout@v4
        with:
          repository: pinmi919/winterfestivalmc-website
          ref: agent/mcwf-website-v2-homepage

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build preview
        run: npm run build -- --base=/winterfestivalmc-preview/

      - name: Harden preview metadata
        run: |
          rm -f dist/CNAME
          python - <<'PY'
          from pathlib import Path
          path = Path('dist/index.html')
          html = path.read_text(encoding='utf-8')
          html = html.replace('content="index, follow, max-image-preview:large"', 'content="noindex, nofollow, noarchive"')
          html = html.replace('<link rel="canonical" href="https://winterfestivalmc.com/" />', '')
          html = html.replace('<meta property="og:url" content="https://winterfestivalmc.com/" />', '')
          path.write_text(html, encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
